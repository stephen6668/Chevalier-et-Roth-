<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth – timeless luxury fashion from Luxembourg."><title>Bag · Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="site-config.js"></script><script src="store.js"></script><script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script><script src="appwrite-auth.js"></script><script src="commerce.js"></script><script src="app.js" defer></script></head><body><main class="page"><div class="eyebrow">YOUR BAG</div><h1 class="page-title">Shopping Bag</h1><p class="legal-subtle">Product prices are shown before VAT. 17% VAT is calculated automatically and added to the final total.</p><div class="cart-layout"><div id="cartItems"></div><aside class="summary"><h2>Summary</h2><div id="summary"></div><label class="field" style="margin:18px 0"><span>Discount code</span><input id="code" placeholder="WELCOME10"></label><button class="btn light" style="width:100%;margin-bottom:10px" onclick="renderCart()">APPLY CODE</button><button class="btn" style="width:100%" disabled>ORDERING OPENS 02.01.2027</button><p class="legal-subtle">Bestellungen sind derzeit deaktiviert.</p></aside></div></main>
<script>
function lines(){
  const ps=CRStore.products();
  return CRStore.cart().map((i,n)=>{
    if(i.bundleId){
      const bundle=CRStore.bundleById(i.bundleId);
      if(!bundle)return null;
      const components=(i.components||[]).map(c=>({...c,product:ps.find(p=>p.id===c.id)})).filter(x=>x.product);
      if(components.length!==bundle.componentIds.length)return null;
      return {...i,n,bundle,components};
    }
    const product=ps.find(p=>p.id===i.id);
    return product?{...i,n,product}:null;
  }).filter(Boolean)
}
function qty(n,q){
  let c=CRStore.cart();
  const item=c[n];
  if(!item)return;
  if(q<=0)c.splice(n,1);
  else if(item.bundleId){
    const b=CRStore.bundleById(item.bundleId),max=CRStore.bundleStock(b);
    if(q>max)return alert('Only '+max+' set(s) are available.');
    c[n].qty=q;
  }else{
    const p=CRStore.products().find(x=>x.id===item.id);
    if(p && q>Number(p.stock||0))return alert('Only '+p.stock+' item(s) are available.');
    c[n].qty=q;
  }
  CRStore.saveCart(c);renderCart();
}
function renderCart(){
 const ls=lines();
 cartItems.innerHTML=ls.length?ls.map(x=>{
   if(x.bundle){
     const details=x.components.map(c=>`${CRStore.esc(c.product.name)} — ${CRStore.esc(c.size)} · ${CRStore.esc(c.color)}`).join('<br>');
     return `<div class="cart-item set-cart-item"><div class="cart-thumb">SET</div><div><h3>${CRStore.esc(x.bundle.name)}</h3><p>${details}</p><p>${CRStore.money(x.bundle.price)} <small class="vat-note">+ ${CRStore.vatPercent()}% VAT</small></p></div><div><button onclick="qty(${x.n},${x.qty-1})">−</button> ${x.qty} <button onclick="qty(${x.n},${x.qty+1})">+</button></div></div>`;
   }
   return `<div class="cart-item"><div class="cart-thumb">CR</div><div><h3>${CRStore.esc(x.product.name)}</h3><p>${CRStore.esc(x.size)} · ${CRStore.esc(x.color)}</p><p>${CRStore.money(CRStore.price(x.product))} <small class="vat-note">+ ${CRStore.vatPercent()}% VAT</small></p></div><div><button onclick="qty(${x.n},${x.qty-1})">−</button> ${x.qty} <button onclick="qty(${x.n},${x.qty+1})">+</button></div></div>`;
 }).join(''):'Your bag is empty.';
 const subtotal=ls.reduce((s,x)=>s+CRStore.cartLineNet(x),0);
 const v=code?.value?CRStore.validateCode(code.value,subtotal,ls):{ok:false,discount:0,msg:''};
 const discount=v.ok?v.discount:0;
 const taxableNet=Math.max(0,subtotal-discount);
 const vat=CRStore.vatOnNet(taxableNet);
 const total=taxableNet+vat;
 summary.innerHTML=`<div class="summary-row"><span>Subtotal before VAT</span><b>${CRStore.money(subtotal)}</b></div>
 <div class="summary-row"><span>Discount</span><b>−${CRStore.money(discount)}</b></div>
 <div class="summary-row"><span>VAT (${CRStore.vatPercent()}%)</span><b>+${CRStore.money(vat)}</b></div>
 <hr><div class="summary-row"><span>Total incl. VAT</span><b>${CRStore.money(total)}</b></div>
 <small>Shipping costs, if applicable, are shown before payment.</small>
 ${code?.value?`<small>${v.msg}</small>`:''}`;
 CRStore.set('checkoutDiscount',v.ok?{code:v.code.code,discount}:null)
}
document.addEventListener('DOMContentLoaded',async()=>{if(window.CRSiteConfig?.orderingEnabled!==true){CRStore.saveCart([])}if(window.CRCommerce)await CRCommerce.syncProducts();renderCart()})
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth – timeless luxury fashion from Luxembourg."><title>Bag · Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="store.js"></script><script src="app.js" defer></script></head><body><main class="page"><div class="eyebrow">YOUR BAG</div><h1 class="page-title">Shopping Bag</h1><div class="cart-layout"><div id="cartItems"></div><aside class="summary"><h2>Summary</h2><div id="summary"></div><label class="field" style="margin:18px 0"><span>Discount code</span><input id="code" placeholder="WELCOME10"></label><button class="btn light" style="width:100%;margin-bottom:10px" onclick="renderCart()">APPLY CODE</button><a href="checkout.html" class="btn" style="width:100%">CHECKOUT</a></aside></div></main>
<script>
function lines(){const ps=CRStore.products();return CRStore.cart().map((i,n)=>({...i,n,product:ps.find(p=>p.id===i.id)})).filter(x=>x.product)}
function qty(n,q){let c=CRStore.cart();if(q<=0)c.splice(n,1);else c[n].qty=q;CRStore.saveCart(c);renderCart()}
function renderCart(){const ls=lines();cartItems.innerHTML=ls.length?ls.map(x=>`<div class="cart-item"><div class="cart-thumb">CR</div><div><h3>${CRStore.esc(x.product.name)}</h3><p>${CRStore.esc(x.size)} · ${CRStore.esc(x.color)}</p><p>${CRStore.money(CRStore.price(x.product))}</p></div><div><button onclick="qty(${x.n},${x.qty-1})">−</button> ${x.qty} <button onclick="qty(${x.n},${x.qty+1})">+</button></div></div>`).join(''):'Your bag is empty.';const subtotal=ls.reduce((s,x)=>s+CRStore.price(x.product)*x.qty,0),v=code?.value?CRStore.validateCode(code.value,subtotal,ls):{ok:false,discount:0,msg:''},discount=v.ok?v.discount:0,total=subtotal-discount;summary.innerHTML=`<div class="summary-row"><span>Subtotal</span><b>${CRStore.money(subtotal)}</b></div><div class="summary-row"><span>Discount</span><b>−${CRStore.money(discount)}</b></div><hr><div class="summary-row"><span>Total</span><b>${CRStore.money(total)}</b></div>${code?.value?`<small>${v.msg}</small>`:''}`;CRStore.set('checkoutDiscount',v.ok?{code:v.code.code,discount}:null)}
document.addEventListener('DOMContentLoaded',renderCart)
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth – refined European fashion designed in Luxembourg and produced in Italy."><title>Search · Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="site-config.js"></script><script src="store.js"></script><script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script><script src="appwrite-auth.js"></script><script src="commerce.js"></script><script src="app.js" defer></script></head><body><main class="page"><div class="eyebrow">SEARCH</div><h1 class="page-title">Find your piece.</h1><div class="field" style="max-width:620px;margin-bottom:28px"><input id="q" placeholder="Search products..." oninput="runSearch()"></div><div class="grid" id="results"></div></main>
<script>function runSearch(){const q=document.getElementById('q').value.toLowerCase();const ps=CRStore.products().filter(p=>p.active&&(`${p.name} ${p.category} ${p.description}`.toLowerCase().includes(q)));document.getElementById('results').innerHTML=ps.map(productCard).join('')}document.addEventListener('DOMContentLoaded',async()=>{if(window.CRCommerce)await CRCommerce.syncProducts();runSearch()})</script></body></html>

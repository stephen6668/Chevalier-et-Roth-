<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog · Chevalier & Roth Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="site-config.js"></script>
  <script src="store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script>
  <script src="appwrite-auth.js"></script>
  <script src="commerce.js"></script>
  <script src="app.js" defer></script>
</head>
<body style="background:var(--apple-canvas)">

  <main style="max-width:1440px;margin:0 auto;padding:60px 32px">
    <div style="margin-bottom:48px">
      <span class="stage-eyebrow">CHEVALIER & ROTH STORE</span>
      <h1 style="font-size:clamp(40px,5vw,68px);margin:10px 0 16px">Die Kollektion.</h1>
      <p style="max-width:640px">Entdecken Sie alle Stücke der Première Edition. Jedes Design ist in den vier charakteristischen Maison-Farben verfügbar.</p>
    </div>

    <!-- Category filter pills -->
    <div style="display:flex;gap:12px;margin-bottom:40px">
      <button class="btn dark-pill" onclick="filterShop('all', this)">Alle Designs</button>
      <button class="btn outline-pill" onclick="filterShop('Men', this)">Herren</button>
      <button class="btn outline-pill" onclick="filterShop('Women', this)">Damen</button>
    </div>

    <!-- Dynamic Catalog Grid -->
    <div id="shopProductGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px"></div>
  </main>

  <script>
    function filterShop(cat, btn) {
      document.querySelectorAll('.btn.dark-pill, .btn.outline-pill').forEach(b => {
        b.className = 'btn outline-pill';
      });
      btn.className = 'btn dark-pill';

      const list = CRStore.products().filter(p => cat === 'all' || p.category === cat);
      renderShopList(list);
    }

    function renderShopList(list) {
      const container = document.getElementById('shopProductGrid');
      container.innerHTML = list.map(p => {
        const cands = CRStore.productImageCandidatesForColor(p, 'Beige/Braun');
        return `
          <div style="background:#fff;border-radius:24px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--apple-shadow-stage)">
            <div>
              <span class="stage-eyebrow" style="font-size:10px">${p.category}</span>
              <h3 style="font-size:24px;margin:4px 0 8px">${p.name}</h3>
              <div style="font-size:17px;font-weight:600;margin-bottom:18px">${CRStore.money(CRStore.price(p))} <small style="font-size:11px;color:#86868b;font-weight:400">+ MwSt.</small></div>
            </div>
            
            <a href="product.html?id=${p.id}" style="display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;overflow:hidden;background:var(--apple-canvas);border-radius:16px;margin:12px 0 24px">
              <img src="${cands[0]||''}" alt="${p.name}" style="max-height:85%;object-fit:contain;filter:drop-shadow(0 20px 25px rgba(0,0,0,0.12))">
            </a>

            <div style="display:flex;gap:10px">
              <a href="product.html?id=${p.id}" class="btn dark-pill" style="flex:1">Konfigurieren</a>
              <button class="btn outline-pill" onclick="openWaitlist('${p.id}')">Warteliste</button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderShopList(CRStore.products());
    });
  </script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth – timeless luxury fashion from Luxembourg."><title>Shop · Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="store.js"></script><script src="app.js" defer></script></head><body>
<main class="page"><div class="eyebrow">CHEVALIER & ROTH</div><h1 class="page-title">Shop</h1>

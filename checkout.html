<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth – timeless luxury fashion from Luxembourg."><title>Checkout · Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="store.js"></script><script src="app.js" defer></script></head><body><main class="page"><div class="eyebrow">CHECKOUT</div><h1 class="page-title">Checkout</h1><div class="notice">GitHub Pages is static hosting. This demo does not collect card details or process real payments.</div><form class="form-grid" onsubmit="createOrder(event)"><label class="field"><span>First name</span><input id="first" required></label><label class="field"><span>Last name</span><input id="last" required></label><label class="field full"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Street</span><input id="street" required></label><label class="field"><span>House no.</span><input id="house" required></label><label class="field"><span>Postal code</span><input id="zip" required></label><label class="field"><span>City</span><input id="city" required></label><label class="field full"><span>Country</span><select id="country"><option>Luxembourg</option><option>Belgium</option><option>France</option><option>Germany</option></select></label><div class="full"><button class="btn">CREATE TEST ORDER</button></div></form></main>
<script>
function createOrder(e){e.preventDefault();const ps=CRStore.products(),cart=CRStore.cart();if(!cart.length)return alert('Your bag is empty.');const ls=cart.map(i=>({...i,product:ps.find(p=>p.id===i.id)})).filter(x=>x.product),subtotal=ls.reduce((s,x)=>s+CRStore.price(x.product)*x.qty,0),discount=CRStore.get('checkoutDiscount',null)?.discount||0,total=subtotal-discount;const o={number:'CR-'+Date.now(),date:new Date().toISOString(),customer:first.value+' '+last.value,email:email.value,total,status:'New Order',payment:'Pending'};let orders=CRStore.orders();orders.push(o);CRStore.saveOrders(orders);CRStore.saveCart([]);alert('Test order created. No payment was taken.');location.href='account.html'}
</script></body></html>

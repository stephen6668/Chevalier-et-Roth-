<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth – timeless luxury fashion from Luxembourg."><title>Account · Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="store.js"></script><script src="app.js" defer></script></head><body><main class="page"><div class="eyebrow">CUSTOMER ACCOUNT</div><h1 class="page-title">My Account</h1><div class="notice">Demo account page. A real secure account system needs an external authentication backend.</div><div id="orders"></div></main><script>document.addEventListener('DOMContentLoaded',()=>{const os=CRStore.orders();orders.innerHTML=os.length?os.map(o=>`<div style="background:white;border:1px solid var(--line);padding:18px;margin:10px 0"><h3>${o.number}</h3><p>${new Date(o.date).toLocaleString()} · ${CRStore.money(o.total)}</p><p>${o.status} · ${o.payment}</p></div>`).join(''):'No test orders yet.'})</script></body></html>

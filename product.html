<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth – refined menswear and womenswear designed in Luxembourg and produced in Italy."><title>Product · Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="site-config.js"></script><script src="store.js"></script><script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script><script src="appwrite-auth.js"></script><script src="commerce.js"></script><script src="app.js" defer></script></head><body><main class="page product-page"><section class="gallery" id="gallery"></section><section class="product-info"><div class="eyebrow" id="cat"></div><h1 id="name"></h1><div><span class="price" id="price"></span><span class="old" id="old"></span></div><div class="vat-note" id="vatInfo">VAT is added automatically to the final total.</div><p id="desc"></p><div class="options"><div class="eyebrow">SIZE</div><div class="chips" id="sizes"></div></div><div class="options"><div class="eyebrow">COLOUR</div><div class="chips" id="colors"></div></div><p id="stock"></p><div id="orderingNotice" class="ordering-disabled-note" hidden><b>FIRST COLLECTION · 02.01.2027</b><span>Bestellungen sind vorerst deaktiviert. Du kannst die Collection bereits ansehen und am Gewinnspiel teilnehmen.</span></div><button class="btn" id="addBagBtn" style="width:100%" onclick="addToCart()">ADD TO BAG</button><button class="btn light waitlist-btn" onclick="openWaitlist(product.id)">JOIN WAITLIST</button><div id="setOffer"></div><div class="trust"><div>DESIGNED IN LUXEMBOURG</div><div>PRODUCED IN ITALY</div><div>14 DAY RETURNS</div></div></section></main>
<script>
let product,selectedSize='',selectedColor='';
document.addEventListener('DOMContentLoaded',async()=>{
  if(window.CRCommerce) await CRCommerce.syncProducts();
  const id=new URLSearchParams(location.search).get('id');
  product=CRStore.products().find(p=>p.id===id)||CRStore.products()[0];
  if(!product)return;
  document.getElementById('name').textContent=product.name;document.getElementById('cat').textContent=product.category;document.getElementById('desc').textContent=product.description;
  document.getElementById('price').textContent=CRStore.money(CRStore.price(product));
  document.getElementById('vatInfo').textContent='+ '+CRStore.vatPercent()+'% VAT · Final price '+CRStore.money(CRStore.grossFromNet(CRStore.price(product)));
  document.getElementById('old').textContent=product.salePrice?CRStore.money(product.price):'';
  const ordersOpen=window.CRSiteConfig?.orderingEnabled===true;
  const soldOut=ordersOpen && Number(product.stock||0)<=0;
  document.getElementById('stock').textContent=ordersOpen?(soldOut?'Sold out':product.stock+' in stock'):'Preview · ordering opens 02.01.2027';
  document.getElementById('stock').className=soldOut?'stock-state sold-out':'stock-state in-stock';
  document.getElementById('orderingNotice').hidden=ordersOpen;
  document.getElementById('addBagBtn').disabled=!ordersOpen||soldOut;
  document.getElementById('addBagBtn').textContent=!ordersOpen?'ORDERING OPENS 02.01.2027':(soldOut?'SOLD OUT':'ADD TO BAG');
  document.getElementById('gallery').classList.add('color-single-gallery');
  const preferredColor='Beige/Braun';
  selectedColor=(CRStore.productColors(product).includes(preferredColor)?preferredColor:CRStore.productColors(product)[0]||'');
  renderSelectedColorImage();
  document.getElementById('sizes').innerHTML=(product.sizes||[]).map(s=>`<button class="chip" onclick="pick(this,'s','${CRStore.esc(s)}')">${CRStore.esc(s)}</button>`).join('');
  document.getElementById('colors').innerHTML=CRStore.productColors(product).map(c=>`<button class="chip color-chip ${c===selectedColor?'active':''}" onclick="pick(this,'c','${CRStore.esc(c)}')"><i class="color-swatch swatch-${CRStore.colorSlug(c)}"></i>${CRStore.esc(c)}</button>`).join('');
  renderSetOffer();
});

function renderSetOffer(){
  const bundle=CRStore.bundleForProduct(product.id);
  const el=document.getElementById('setOffer');
  if(!el||!bundle){if(el)el.innerHTML='';return}
  const ps=CRStore.bundleProducts(bundle);
  const stock=CRStore.bundleStock(bundle);
  el.innerHTML=`<section class="product-set-offer">
    <div><span class="eyebrow">SET OPTION</span><h3>${CRStore.esc(bundle.name)}</h3><p>${ps.map(p=>CRStore.esc(p.name)).join(' + ')}</p></div>
    <div class="product-set-price"><b>${CRStore.money(bundle.price)}</b><small>+ ${CRStore.vatPercent()}% VAT · ${CRStore.money(CRStore.grossFromNet(bundle.price))} total</small></div>
    <button class="btn" ${((window.CRSiteConfig?.orderingEnabled!==true)||stock<=0)?'disabled':''} onclick="openSetBuilder('${bundle.id}')">${window.CRSiteConfig?.orderingEnabled!==true?'AVAILABLE 02.01.2027':(stock<=0?'SET SOLD OUT':'BUY AS SET')}</button>
  </section>`;
}

function renderSelectedColorImage(){
  const candidates=CRStore.productImageCandidatesForColor(product,selectedColor||'Beige/Braun');
  const img=candidates[0]||'';
  const fallbacks=CRStore.esc(encodeURIComponent(JSON.stringify(candidates.slice(1))));
  document.getElementById('gallery').innerHTML=`<div class="gallery-box color-main-image">${img?`<img src="${CRStore.esc(img)}" data-cr-fallbacks="${fallbacks}" alt="${CRStore.esc(product.name)} · ${CRStore.esc(selectedColor)}" loading="eager" onerror="if(!CRStore.tryNextImage(this)){this.style.display='none';this.parentElement.querySelector('.color-image-fallback').style.display='grid'}"><span class="color-image-fallback" style="display:none">CR</span>`:'<span class="color-image-fallback">CR</span>'}<div class="color-image-label">${CRStore.esc(selectedColor||'')}</div></div>`;
}
function pick(el,t,v){
  el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  if(t==='s')selectedSize=v;
  else{selectedColor=v;renderSelectedColorImage()}
}
function addToCart(){
  if(window.CRSiteConfig?.orderingEnabled!==true)return alert('Bestellungen sind vorerst deaktiviert. Die erste Collection startet am 02.01.2027.');
  if(Number(product.stock||0)<=0)return alert('This product is sold out.');
  if(!selectedSize||!selectedColor)return alert('Please select size and colour.');
  let c=CRStore.cart(),x=c.find(i=>i.id===product.id&&i.size===selectedSize&&i.color===selectedColor);
  const current=x?x.qty:0;
  if(current>=Number(product.stock||0))return alert('No more stock is available.');
  if(x)x.qty++;else c.push({id:product.id,size:selectedSize,color:selectedColor,qty:1});
  CRStore.saveCart(c);alert('Added to bag.');
}
</script></body></html>

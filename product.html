<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produkt · Chevalier & Roth</title>
  <link rel="stylesheet" href="style.css">
  <script src="site-config.js"></script>
  <script src="store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script>
  <script src="appwrite-auth.js"></script>
  <script src="commerce.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page section" style="padding-top:40px">
    <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:60px;align-items:start">
      
      <!-- Studio Gallery -->
      <section class="gallery" id="gallery" style="position:sticky;top:100px;display:flex;justify-content:center;background:#fff;border:1px solid var(--cr-line);padding:24px">
        <div class="color-main-image" style="width:100%;max-width:580px;aspect-ratio:53/96"></div>
      </section>

      <!-- Editorial Info Panel -->
      <section class="product-info" style="display:flex;flex-direction:column;gap:18px">
        <span class="eyebrow" id="cat">KOLLEKTION</span>
        <h1 id="name" style="font-size:clamp(36px,4vw,56px);line-height:1.05"></h1>
        
        <div style="display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--cr-line);padding-bottom:18px">
          <span class="price" id="price" style="font-family:'Playfair Display',serif;font-size:32px;font-weight:500"></span>
          <span class="old" id="old" style="text-decoration:line-through;color:var(--cr-ink-tertiary);font-size:18px"></span>
          <span class="vat-note" id="vatInfo" style="font-size:12px;color:var(--cr-ink-secondary)"></span>
        </div>

        <p id="desc" style="font-size:15px;line-height:1.8;color:var(--cr-ink-secondary)"></p>

        <!-- Color Selection -->
        <div style="margin-top:10px">
          <span class="eyebrow">FARBAUSWAHL</span>
          <div class="chips" id="colors" style="display:flex;gap:10px;margin-top:8px"></div>
        </div>

        <!-- Size Selection -->
        <div style="margin-top:10px">
          <span class="eyebrow">GRÖSSE</span>
          <div class="chips" id="sizes" style="display:flex;gap:8px;margin-top:8px"></div>
        </div>

        <!-- Availability Status -->
        <div style="margin:16px 0;padding:16px;background:var(--cr-alabaster);border:1px solid var(--cr-line)">
          <div style="font-size:10px;letter-spacing:0.2em;color:var(--cr-gold-dark);font-weight:600">STATUS</div>
          <div id="stock" style="font-size:14px;font-weight:500;margin-top:4px">Bestellungen öffnen am 02.01.2027</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px">
          <button class="btn" id="addBagBtn" onclick="addToCart()">IN DEN WARENKORB</button>
          <button class="btn light" onclick="openWaitlist(product.id)">AUF DIE WARTELISTE</button>
        </div>

        <div id="setOffer" style="margin-top:20px"></div>

        <!-- Quality Guarantees -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:24px;border-top:1px solid var(--cr-line);padding-top:24px;text-align:center">
          <div><small style="font-size:9px;letter-spacing:0.18em;color:var(--cr-gold-dark)">DESIGN</small><div style="font-size:11px;font-weight:600">LUXEMBOURG</div></div>
          <div><small style="font-size:9px;letter-spacing:0.18em;color:var(--cr-gold-dark)">MANUFAKTUR</small><div style="font-size:11px;font-weight:600">ITALIEN</div></div>
          <div><small style="font-size:9px;letter-spacing:0.18em;color:var(--cr-gold-dark)">RÜCKGABE</small><div style="font-size:11px;font-weight:600">14 TAGE</div></div>
        </div>
      </section>

    </div>
  </main>

  <script>
    let product, selectedSize = '', selectedColor = '';
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.CRCommerce) await CRCommerce.syncProducts();
      const id = new URLSearchParams(location.search).get('id');
      product = CRStore.products().find(p => p.id === id) || CRStore.products()[0];
      if (!product) return;

      document.getElementById('name').textContent = product.name;
      document.getElementById('cat').textContent = product.category;
      document.getElementById('desc').textContent = product.description;
      document.getElementById('price').textContent = CRStore.money(CRStore.price(product));
      document.getElementById('vatInfo').textContent = `+ ${CRStore.vatPercent()}% VAT · ${CRStore.money(CRStore.grossFromNet(CRStore.price(product)))} inkl. MwSt.`;
      
      const ordersOpen = window.CRSiteConfig?.orderingEnabled === true;
      const addBtn = document.getElementById('addBagBtn');
      addBtn.disabled = !ordersOpen;
      addBtn.textContent = ordersOpen ? 'IN DEN WARENKORB' : 'LAUNCH 02.01.2027';

      const preferredColor = 'Beige/Braun';
      selectedColor = (CRStore.productColors(product).includes(preferredColor) ? preferredColor : CRStore.productColors(product)[0] || '');
      renderSelectedColorImage();

      document.getElementById('sizes').innerHTML = (product.sizes || []).map(s => `
        <button type="button" class="chip" style="padding:10px 18px;border:1px solid var(--cr-line);background:#fff;cursor:pointer" onclick="pick(this,'s','${CRStore.esc(s)}')">${CRStore.esc(s)}</button>
      `).join('');

      document.getElementById('colors').innerHTML = CRStore.productColors(product).map(c => `
        <button type="button" class="chip color-chip ${c === selectedColor ? 'active' : ''}" style="padding:10px 16px;border:1px solid var(--cr-line);background:#fff;cursor:pointer" onclick="pick(this,'c','${CRStore.esc(c)}')">${CRStore.esc(c)}</button>
      `).join('');
    });

    function renderSelectedColorImage() {
      const candidates = CRStore.productImageCandidatesForColor(product, selectedColor || 'Beige/Braun');
      const img = candidates[0] || '';
      document.getElementById('gallery').innerHTML = `
        <div style="width:100%;max-width:580px;aspect-ratio:53/96;overflow:hidden">
          <img src="${CRStore.esc(img)}" alt="${CRStore.esc(product.name)}" style="width:100%;height:100%;object-fit:cover">
        </div>
      `;
    }

    function pick(el, type, val) {
      el.parentElement.querySelectorAll('.chip').forEach(x => {
        x.style.background = '#fff';
        x.style.color = 'var(--cr-ink)';
      });
      el.style.background = 'var(--cr-obsidian)';
      el.style.color = '#fff';
      if (type === 's') selectedSize = val;
      else {
        selectedColor = val;
        renderSelectedColorImage();
      }
    }

    function addToCart() {
      if (window.CRSiteConfig?.orderingEnabled !== true) {
        alert('Bestellungen sind vorübergehend deaktiviert. Die Kollektion startet am 02.01.2027.');
        return;
      }
      if (!selectedSize || !selectedColor) {
        alert('Bitte wählen Sie zuerst Größe und Farbe aus.');
        return;
      }
      let c = CRStore.cart(), x = c.find(i => i.id === product.id && i.size === selectedSize && i.color === selectedColor);
      if (x) x.qty++; else c.push({ id: product.id, size: selectedSize, color: selectedColor, qty: 1 });
      CRStore.saveCart(c);
      alert('Erfolgreich zum Warenkorb hinzugefügt.');
    }
  </script>
</body>
</html>

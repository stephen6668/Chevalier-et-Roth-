<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth – timeless luxury fashion from Luxembourg."><title>Product · Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="store.js"></script><script src="app.js" defer></script></head><body><main class="page product-page"><section class="gallery" id="gallery"></section><section class="product-info"><div class="eyebrow" id="cat"></div><h1 id="name"></h1><div><span class="price" id="price"></span><span class="old" id="old"></span></div><p id="desc"></p><div class="options"><div class="eyebrow">SIZE</div><div class="chips" id="sizes"></div></div><div class="options"><div class="eyebrow">COLOUR</div><div class="chips" id="colors"></div></div><p id="stock"></p><button class="btn" style="width:100%" onclick="addToCart()">ADD TO BAG</button><div class="trust"><div>14 DAY RETURNS</div><div>EU SHIPPING READY</div><div>SECURE PAYMENT READY</div></div></section></main>
<script>
let product,selectedSize='',selectedColor='';
document.addEventListener('DOMContentLoaded',()=>{const id=new URLSearchParams(location.search).get('id');product=CRStore.products().find(p=>p.id===id)||CRStore.products()[0];name.textContent=product.name;cat.textContent=product.category;desc.textContent=product.description;price.textContent=CRStore.money(CRStore.price(product));old.textContent=product.salePrice?CRStore.money(product.price):'';stock.textContent=product.stock>0?product.stock+' in stock':'Sold out';gallery.innerHTML=(product.images&&product.images.length?product.images:[null,null]).map(x=>`<div class="gallery-box">${x?`<img src="${CRStore.esc(x)}">`:'CR'}</div>`).join('');sizes.innerHTML=product.sizes.map(s=>`<button class="chip" onclick="pick(this,'s','${CRStore.esc(s)}')">${CRStore.esc(s)}</button>`).join('');colors.innerHTML=product.colors.map(c=>`<button class="chip" onclick="pick(this,'c','${CRStore.esc(c)}')">${CRStore.esc(c)}</button>`).join('')});
function pick(el,t,v){el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(t==='s')selectedSize=v;else selectedColor=v}
function addToCart(){if(!selectedSize||!selectedColor)return alert('Please select size and colour.');let c=CRStore.cart(),x=c.find(i=>i.id===product.id&&i.size===selectedSize&&i.color===selectedColor);if(x)x.qty++;else c.push({id:product.id,size:selectedSize,color:selectedColor,qty:1});CRStore.saveCart(c);alert('Added to bag.')}
</script></body></html>
